name: Runtime smoke

on:
  pull_request:
    branches:
      - main

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-runtime-smoke
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install WebKit
        run: npx -y playwright@1.54.2 install --with-deps webkit

      - name: Start application
        run: |
          npm run start > /tmp/clw-next.log 2>&1 &
          echo $! > /tmp/clw-next.pid

      - name: Wait for application
        run: npx -y wait-on@8.0.3 http://127.0.0.1:3000/sponsorship --timeout 60000

      - name: Run mobile WebKit smoke test
        run: npx -y -p playwright@1.54.2 -c 'node scripts/runtime-smoke.cjs'

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/clw-next.log
