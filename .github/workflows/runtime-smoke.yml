name: Runtime smoke

on:
  pull_request:
    branches:
      - main

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INCIDENT_URL: https://clw-wizards-m45v3hwv1-creativeeyemm.vercel.app
      PREVIEW_URL: https://clw-wizards-git-agent-fix-support-runtime-creativeeyemm.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps webkit

      - name: Wait for Vercel preview
        run: |
          for attempt in {1..72}; do
            status=$(curl --location --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/sponsorship")
            if [ "$status" = "200" ]; then
              echo "Preview is ready."
              exit 0
            fi
            echo "Preview returned $status. Waiting for deployment..."
            sleep 5
          done
          echo "Preview did not become ready in time."
          exit 1

      - name: Capture original incident deployment
        env:
          BASE_URL: ${{ env.INCIDENT_URL }}
          REPORT_DIR: artifacts/incident-deployment
          REPORT_ONLY: '1'
        run: node scripts/runtime-smoke.cjs

      - name: Validate current preview in mobile WebKit
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}
          REPORT_DIR: artifacts/current-preview
        run: node scripts/runtime-smoke.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-mobile-webkit-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
